        .upload-label {

            margin-bottom: 8px;
            color: #333;
            font-size: 13px;
        }
        
        .file-input, .text-input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: #fff;
            color: #222;
            transition: border-color 0.2s;
        }
        
        .file-input:hover, .text-input:hover,
        .file-input:focus, .text-input:focus {

            outline: none;
        }
        
        .file-input::file-selector-button {
            background: #333;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            margin-right: 12px;
            transition: background 0.2s;
        }
        
        .file-input::file-selector-button:hover {
            background: #111;
        }
        
        .process-button {
            background: #111;
            color: #fff;
            border: none;
            padding: 14px 48px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin: 32px auto 0;
            transition: all 0.2s ease;
        }
        
        .process-button:hover:not(:disabled) {
            background: #333;
        }
        
        .process-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* コンテンツセクション */
        .content-section {
            display: none;
        }
        
        .gloss-info-banner {
            background: #f8f8f8;
            border-left: 3px solid #333;
            padding: 14px 18px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #555;
        }
        
        .gloss-info-banner strong {
            color: #222;
        }
        
        .gloss-info-banner a {
            color: #333;
            text-decoration: underline;
        }
        
        .status-bar {
            background: #f8f8f8;
            padding: 14px 18px;
            border-radius: 4px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        
        .status-info {
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-info span {
            color: #111;
            font-weight: 600;
        }
        
        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #333;
        }
        
        /* 連続再生コントロール */
        .playback-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 32px;
            gap: 12px;
        }
        
        .play-all-button, .download-button {
            background: #fff;
            color: #333;
            border: 1px solid #ddd;
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        
        .play-all-button:hover, .download-button:hover {
            border-color: #333;
            background: #333;
            color: #fff;
        }
        
        .play-all-button.playing {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        .play-all-button .button-icon, .download-button .button-icon {
            font-size: 14px;
        }
        
        /* 例文リスト */
        .example-list {
            margin-top: 24px;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .example-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .example-list::-webkit-scrollbar-track {
            background: #f0f0f0;
        }
        
        .example-list::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 3px;
        }
        
        .example-item {
            margin: 0;
            padding: 20px 24px;
            background: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
            border-bottom: 1px solid #eee;
            position: relative;
        }
        
        .example-item:first-child {
            border-top: 1px solid #eee;
        }
        
        .example-item:hover {
            background: #f8f8f8;
        }
        
        .example-item.playing {
            background: #f0f0f0;
        }
        
        .example-number {
            font-weight: 600;
            color: #333;
            margin-right: 12px;
            font-size: 14px;
        }
        
        .speaker-name {
            font-weight: 500;
            color: #666;
            font-size: 13px;
            margin-left: 4px;
        }
        
        .interlinear-container {
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
            line-height: 1.8;
            overflow-x: auto;
            white-space: nowrap;
        }
        
        .interlinear-row {
            display: flex;
            align-items: flex-start;
            gap: 0.5em;
        }
        
        .word-group {
            display: inline-flex;
            flex-direction: column;
            align-items: flex-start;
            margin-right: 0.5em;
        }
        
        .original-word {
            font-size: 16px;
            color: #111;
            font-weight: 500;
            font-family: Georgia, 'Times New Roman', serif;
        }
        
        .gloss-word {
            font-size: 13px;
            color: #666;
            font-variant: small-caps;
            font-family: 'Courier New', monospace;
        }
        
        .gloss-clickable {
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
            text-underline-offset: 2px;
            color: #333;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        
        .gloss-clickable:hover {
            color: #000;
        }
        
        .translation-text {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            white-space: normal;
        }
        
        .play-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .example-item:hover .play-icon {
            background: #333;
            color: #fff;
        }
        
        .example-item.playing .play-icon {
            background: #333;
            color: #fff;
        }
        
        /* グロス吹き出し */
        .gloss-tooltip {
            position: fixed;
            background: #111;
            color: #fff;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 1000;
            max-width: 280px;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
        }
        
        .gloss-tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .gloss-tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            margin-left: -5px;
            border-width: 5px;
            border-style: solid;
            border-color: #111 transparent transparent transparent;
        }
        
        .gloss-tooltip-title {
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
        }
        
        /* オーディオプレーヤー */
        #audioPlayer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #111;
            padding: 16px 24px;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: none;
            align-items: center;
            gap: 16px;
            color: #fff;
            font-size: 13px;
        }
        
        #audioPlayer.active {
            display: flex;
        }
        
        .audio-progress {
            width: 160px;
            height: 4px;
            background-color: #444;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .audio-progress-bar {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.1s linear;
        }
        
        /* ステータスメッセージ */
        .status-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            display: none;
        }
        
        .status-message.info {
            background: #f0f0f0;
            color: #333;
            display: block;
        }
        
        .status-message.success {
            background: #f0f0f0;
            color: #333;
            display: block;
        }
        
        .status-message.error {
            background: #fef2f2;
            color: #991b1b;
            display: block;
        }
        
        /* Zenodo取得機能 */
        .zenodo-section {
            margin-top: 12px;
            padding: 18px;
            background: #f8f8f8;
            border-radius: 4px;
        }
        .zenodo-section label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .zenodo-row {
            display: flex;
            gap: 8px;
        }
        .zenodo-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            background: #fff;
            color: #222;
            transition: border-color 0.2s;
        }
        .zenodo-input:focus {
            outline: none;
            border-color: #999;
        }
        .zenodo-input::placeholder {
            color: #aaa;
        }
        .zenodo-btn {
            padding: 10px 20px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .zenodo-btn:hover {
            background: #111;
        }
        .zenodo-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .zenodo-status {
            font-size: 12px;
            margin-top: 10px;
            color: #666;
        }
        .zenodo-status.success {
            color: #166534;
        }
        .zenodo-status.error {
            color: #991b1b;
        }
        .manual-url-section {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #e0e0e0;
        }
        .manual-url-section label {
            color: #888 !important;
        }
        .manual-url-textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'SF Mono', 'Monaco', 'Consolas', monospace;
            resize: vertical;
            background: #fff;
            color: #222;
            transition: border-color 0.2s;
        }
        .manual-url-textarea:focus {
            outline: none;
            border-color: #999;
        }
        .manual-url-textarea::placeholder {
            color: #aaa;
        }
        .manual-url-count {
            font-size: 12px;
            color: #888;
            margin-top: 8px;
        }
        .manual-url-count.has-urls {
            color: #166534;
        }
        
        /* small text */
        small {
            color: #888 !important;
            font-size: 12px;
        }
        
        /* フォントサイズ調整コントロール */
        .font-size-control {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f8f8;
            padding: 12px 18px;
            border-radius: 4px;
            margin-bottom: 16px;
        }
        
        .font-size-label {
            font-size: 13px;
            color: #555;
            font-weight: 500;
            white-space: nowrap;
        }
        
        .font-size-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        
        .font-size-btn:hover {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        #titleSizeSlider {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #ddd;
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        
        #titleSizeSlider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        #titleSizeSlider::-webkit-slider-thumb:hover {
            background: #111;
        }
        
        #titleSizeSlider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #333;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        
        .font-size-display {
            font-size: 12px;
            color: #888;
            min-width: 45px;
        }
        
        /* 背景画像プレビュー */
        .header-image-preview {
            margin-top: 10px;
            max-width: 200px;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .header-image-preview img {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* 背景画像変更ボタン */
        .header-image-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .header-image-btn:hover {
            background: #333;
            color: #fff;
            border-color: #333;
        }
        
        /* ヘッダー背景画像対応 */
        .header-section.has-bg-image {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }
        
        .header-section.has-bg-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 4px 4px 0 0;
        }
        
        .header-section.has-bg-image h1,
        .header-section.has-bg-image .subtitle,
        .header-section.has-bg-image .credits {
            position: relative;
            z-index: 1;
        }
        
        audio {
            display: none;
        }
    </style>
</head>

            <div class="playback-controls">

                <button id="downloadBtn" class="download-button">

                </button>
            </div>
            
            <div class="example-list" id="exampleList"></div>
        </div>
        
        <!-- オーディオプレーヤー -->
        <div id="audioPlayer" class="">

            <span id="currentExample">例文 (5)</span>
            <div class="audio-progress">
                <div class="audio-progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>
        </div>
        
        <audio id="audio" crossorigin="anonymous" src="https://zenodo.org/api/records/18167811/files/272_NY_dummy.wav/content?download=1"></audio>

            </div>
        </div>

        // 画像を圧縮する関数
        function compressImage(file, callback) {
            const compressionLevel = document.getElementById('imageCompression')?.value || 'medium';
            const settings = compressionSettings[compressionLevel];
            
            // 圧縮なしの場合はそのまま読み込む
            if (compressionLevel === 'none') {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const originalSize = file.size;
                    updateCompressionInfo(originalSize, originalSize);
                    callback(e.target.result);
                };
                reader.readAsDataURL(file);
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    // 最大幅を超える場合はリサイズ
                    if (width > settings.maxWidth) {
                        height = Math.round(height * settings.maxWidth / width);
                        width = settings.maxWidth;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    // JPEG形式で圧縮（PNG透過が必要な場合は考慮）
                    const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
                    const quality = file.type === 'image/png' ? undefined : settings.quality;
                    const compressedDataUrl = canvas.toDataURL(mimeType, quality);
                    
                    // 圧縮情報を表示
                    const originalSize = file.size;
                    const compressedSize = Math.round(compressedDataUrl.length * 0.75); // Base64→バイト概算
                    updateCompressionInfo(originalSize, compressedSize);
                    
                    callback(compressedDataUrl);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        // 圧縮情報を表示
        function updateCompressionInfo(originalSize, compressedSize) {
            const infoEl = document.getElementById('compressionInfo');
            if (infoEl) {
                const originalKB = (originalSize / 1024).toFixed(1);
                const compressedKB = (compressedSize / 1024).toFixed(1);
                const ratio = ((1 - compressedSize / originalSize) * 100).toFixed(0);
                
                if (originalSize === compressedSize) {
                    infoEl.textContent = `画像サイズ: ${originalKB} KB（圧縮なし）`;
                } else {
                    infoEl.textContent = `元: ${originalKB} KB → 圧縮後: ${compressedKB} KB（${ratio}%削減）`;

        // ZenodoレコードURLから音声ファイルURLを取得
        async function fetchZenodoFiles(recordUrl) {
            // ZenodoのレコードURLからレコードIDを抽出
            const match = recordUrl.match(/zenodo\.org\/records\/(\d+)/);
            if (!match) {
                throw new Error('無効なZenodo URLです。例: https://zenodo.org/records/12345678');
            }
            
            const recordId = match[1];
            const apiUrl = `https://zenodo.org/api/records/${recordId}`;
            
            // CORSプロキシを試行（複数のプロキシを順番に試す）
            const proxyUrls = [
                apiUrl, // まず直接アクセスを試みる
                `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`,
                `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`,
                `https://thingproxy.freeboard.io/fetch/${apiUrl}`,
                `https://cors.bridged.cc/${apiUrl}`
            ];
            
            let data = null;
            let lastError = null;
            
            for (const url of proxyUrls) {
                try {
                    console.log('Trying:', url);
                    const response = await fetch(url);
                    if (response.ok) {
                        let jsonData = await response.json();
                        // alloriginsはcontentsフィールドにデータをラップする
                        if (jsonData.contents) {
                            jsonData = JSON.parse(jsonData.contents);
                        }
                        data = jsonData;
                        console.log('Success with:', url);
                        break;
                    }
                } catch (e) {
                    lastError = e;
                    console.log(`Proxy failed: ${url}`, e.message);
                }
            }
            
            if (!data) {
                throw new Error('Zenodo APIへの接続に失敗しました。CORSプロキシがすべて利用不可です。');
            }
            
            if (!data.files || data.files.length === 0) {
                throw new Error('このレコードにはファイルがありません');
            }
            
            // 音声ファイルをフィルタリング
            const audioExtensions = ['.wav', '.mp3', '.ogg', '.flac', '.m4a'];
            const audioFiles = data.files.filter(f => {
                const ext = f.key.toLowerCase().substring(f.key.lastIndexOf('.'));
                return audioExtensions.includes(ext);
            });
            
            if (audioFiles.length === 0) {
                throw new Error('音声ファイルが見つかりません（.wav, .mp3など）');
            }
            
            // 個別音声（001_, 002_など）と全体音声（text_など）を分離
            const individualFiles = [];
            let fullAudioFile = null;
            
            for (const f of audioFiles) {
                const filename = f.key;
                // 数字3桁_で始まるファイルは個別音声
                if (/^\d{3}_/.test(filename)) {
                    individualFiles.push(f);
                } 
                // text_で始まる、または "full" を含むファイルは全体音声
                else if (/^text_/i.test(filename) || /full/i.test(filename)) {
                    fullAudioFile = f;
                }
                // それ以外で番号が含まれないファイルも全体音声候補
                else if (!/\d{3}/.test(filename)) {
                    fullAudioFile = f;
                }
                // それ以外は個別音声として扱う
                else {
                    individualFiles.push(f);
                }
            }
            
            // ファイル名でソート（001_, 002_などの番号順）
            individualFiles.sort((a, b) => a.key.localeCompare(b.key, undefined, { numeric: true }));
            
            // ダウンロードURLを生成
            const individualUrls = individualFiles.map(f => f.links.self + '?download=1');
            const fullUrl = fullAudioFile ? fullAudioFile.links.self + '?download=1' : null;
            
            return {
                individualUrls,
                fullAudioUrl: fullUrl,
                fullAudioFilename: fullAudioFile ? fullAudioFile.key : null
            };
        }

        // テキストファイルを処理
        async function processTextFile(file) {
            const text = await file.text();
            const lines = text.split('\n');
            
            examples = [];
            let lineIndex = 0;
            
            while (lineIndex < lines.length) {
                const line = lines[lineIndex].trim();
                
                // 例文番号の検出（話者名付きにも対応）
                // 形式: (1) または (1) [話者名]
                const numberMatch = line.match(/^\((\d+)\)\s*(?:\[(.+?)\])?(.*)$/);
                if (numberMatch) {
                    const id = parseInt(numberMatch[1]);
                    const speaker = numberMatch[2] || ''; // 話者名（あれば）
                    const remainingText = numberMatch[3] ? numberMatch[3].trim() : '';
                    
                    const currentExample = {
                        id: id,
                        speaker: speaker,
                        original: '',
                        gloss: '',
                        japanese: ''
                    };
                    
                    // 次の行から内容を収集
                    const contentLines = [];
                    
                    // 番号行に残りのテキストがある場合は追加
                    if (remainingText) {
                        contentLines.push(remainingText);
                    }
                    
                    lineIndex++;
                    
                    // 次の例文番号が来るまで行を収集
                    while (lineIndex < lines.length) {
                        const nextLine = lines[lineIndex].trim();
                        
                        // 次の例文番号に到達したら終了
                        if (nextLine.match(/^\((\d+)\)\s*(?:\[.+?\])?/)) {
                            break;
                        }
                        
                        // 空行はスキップするが、収集は続ける
                        if (nextLine) {
                            contentLines.push(nextLine);
                        }
                        
                        lineIndex++;
                    }
                    
                    // 収集した行数に基づいて形式を判定
                    if (contentLines.length === 2) {
                        // 2行形式: 例文、日本語訳
                        currentExample.original = contentLines[0];
                        currentExample.japanese = contentLines[1];
                        currentExample.gloss = ''; // グロスなし
                    } else if (contentLines.length === 3) {
                        // 3行形式: 原文、グロス、日本語訳
                        currentExample.original = contentLines[0];
                        currentExample.gloss = contentLines[1];
                        currentExample.japanese = contentLines[2];
                    } else if (contentLines.length >= 4) {
                        // 4行形式: スペースあり例文、形態素境界入り例文、グロス、日本語訳
                        currentExample.originalSpaced = contentLines[0]; // スペースあり例文
                        currentExample.original = contentLines[1]; // 形態素境界入り例文
                        currentExample.gloss = contentLines[2];
                        currentExample.japanese = contentLines[3];
                        
                        // 日本語訳が複数行にわたる場合は結合
                        for (let i = 4; i < contentLines.length; i++) {
                            if (contentLines[i].match(/[\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf]/)) {
                                currentExample.japanese += contentLines[i];
                            }
                        }
                    }
                    
                    // 例文を追加
                    if (currentExample.original) {
                        examples.push(currentExample);
                    }
                } else {
                    lineIndex++;
                }
            }
            
            console.log(`テキストファイルから${examples.length}個の例文を抽出しました`);
            
            // デバッグ用：最初の3つの例文を表示
            examples.slice(0, 3).forEach(ex => {
                console.log(`例文${ex.id}:`);
                console.log(`  原文: ${ex.original}`);
                console.log(`  グロス: ${ex.gloss}`);
                console.log(`  日本語: ${ex.japanese}`);
            });
        }
        
        // PDFを処理
        async function processPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
            
            examples = [];
            let allTextItems = [];
            
            // 全ページのテキストアイテムを収集
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                const page = await pdf.getPage(pageNum);
                const textContent = await page.getTextContent();
                
                textContent.items.forEach(item => {
                    if (item.str.trim()) {
                        allTextItems.push({
                            text: item.str,
                            x: item.transform[4],
                            y: item.transform[5],
                            page: pageNum
                        });
                    }
                });
            }
            
            // Y座標でソート（上から下へ）
            allTextItems.sort((a, b) => {
                if (a.page !== b.page) return a.page - b.page;
                return b.y - a.y;
            });
            
            // 同じ行のアイテムをグループ化
            let lines = [];
            let currentLine = [];
            let lastY = null;
            
            allTextItems.forEach(item => {
                if (lastY === null || Math.abs(item.y - lastY) < 5) {
                    currentLine.push(item);
                } else {
                    if (currentLine.length > 0) {
                        // X座標でソート（左から右へ）
                        currentLine.sort((a, b) => a.x - b.x);
                        const lineText = currentLine.map(i => i.text).join(' ');
                        lines.push(lineText);
                    }
                    currentLine = [item];
                }
                lastY = item.y;
            });
            
            // 最後の行を追加
            if (currentLine.length > 0) {
                currentLine.sort((a, b) => a.x - b.x);
                const lineText = currentLine.map(i => i.text).join(' ');
                lines.push(lineText);
            }
            
            // 例文を解析
            let currentExample = null;
            let expectingGloss = false;
            let expectingJapanese = false;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // 例文番号の検出
                const numberMatch = line.match(/^[\(（](\d+)[\)）]\s*(.+)$/);
                if (numberMatch) {
                    // 前の例文を保存
                    if (currentExample) {
                        examples.push(currentExample);
                    }
                    
                    currentExample = {
                        id: parseInt(numberMatch[1]),
                        original: numberMatch[2].trim(),
                        gloss: '',
                        japanese: ''
                    };
                    expectingGloss = true;
                    expectingJapanese = false;
                } else if (currentExample && expectingGloss) {
                    // グロス行（小文字、ピリオド、大文字を含む）
                    if (line.match(/^[a-zA-Z0-9\.\-\s]+$/)) {
                        currentExample.gloss = line;
                        expectingGloss = false;
                        expectingJapanese = true;
                    }
                } else if (currentExample && expectingJapanese) {
                    // 日本語訳
                    if (line.match(/[\u3040-\u309f\u30a0-\u30ff\u4e00-\u9faf]/)) {
                        currentExample.japanese = line;
                        expectingJapanese = false;
                    }
                }
            }
            
            // 最後の例文を保存
            if (currentExample) {
                examples.push(currentExample);
            }
            
            console.log(`PDFから${examples.length}個の例文を抽出しました`);
            
            // デバッグ用：最初の3つの例文を表示
            examples.slice(0, 3).forEach(ex => {
                console.log(`例文${ex.id}:`);
                console.log(`  原文: ${ex.original}`);
                console.log(`  グロス: ${ex.gloss}`);
                console.log(`  日本語: ${ex.japanese}`);
            });
        }

        // 例文要素を作成
        function createExampleElement(example, index) {
            const div = document.createElement('div');
            div.className = 'example-item';
            div.dataset.id = example.id;
            
            // インターリニア形式で表示
            let interlinearHTML;
            if (example.originalSpaced) {
                // 4行形式の場合
                interlinearHTML = createInterlinearHTML4Line(example.originalSpaced, example.original, example.gloss);
            } else {
                // 2行または3行形式の場合
                interlinearHTML = createInterlinearHTML(example.original, example.gloss);
            }
            
            // 話者名の表示（あれば）
            const speakerHTML = example.speaker 
                ? `<span class="speaker-name">[${example.speaker}]</span>` 
                : '';
            
            div.innerHTML = `
                <div class="example-number">(${example.id}) ${speakerHTML}</div>
                <div class="example-text">
                    <div class="interlinear-container">
                        ${interlinearHTML}
                    </div>
                    <div class="translation-text">${example.japanese}</div>
                </div>
                <div class="play-icon">▶</div>
            `;
            
            // クリックイベントを追加
            div.addEventListener('click', function(e) {
                if (!e.target.classList.contains('gloss-clickable')) {
                    playExample(example.id);
                }
            });
            
            return div;
        }
        
        // インターリニア形式のHTMLを生成
        function createInterlinearHTML(originalText, glossText) {
            const originalWords = originalText.split(/\s+/);
            const glossWords = glossText.split(/\s+/);
            
            let html = '<div class="interlinear-row">';
            
            for (let i = 0; i < Math.max(originalWords.length, glossWords.length); i++) {
                const originalWord = originalWords[i] || '';
                const glossWord = glossWords[i] || '';
                
                // グロスをクリック可能にする
                const clickableGloss = makeGlossClickable(glossWord);
                
                html += `
                    <div class="word-group">
                        <div class="original-word">${originalWord}</div>
                        <div class="gloss-word">${clickableGloss}</div>
                    </div>
                `;
            }
            
            html += '</div>';
            return html;
        }
        
        // 4行形式のインターリニアHTMLを生成
        function createInterlinearHTML4Line(spacedText, boundaryText, glossText) {
            const spacedWords = spacedText.split(/\s+/);
            const boundaryWords = boundaryText.split(/\s+/);
            const glossWords = glossText.split(/\s+/);
            
            let html = '<div class="interlinear-row">';
            
            for (let i = 0; i < Math.max(spacedWords.length, boundaryWords.length, glossWords.length); i++) {
                const spacedWord = spacedWords[i] || '';
                const boundaryWord = boundaryWords[i] || '';
                const glossWord = glossWords[i] || '';
                
                // グロスをクリック可能にする
                const clickableGloss = makeGlossClickable(glossWord);
                
                html += `
                    <div class="word-group">
                        <div class="original-word">${spacedWord}</div>
                        <div class="original-word" style="font-size: 16px; color: #444; font-weight: normal;">${boundaryWord}</div>
                        <div class="gloss-word">${clickableGloss}</div>
                    </div>
                `;
            }
            
            html += '</div>';
            return html;
        }
        
        // グロスをクリック可能にする
        function makeGlossClickable(glossText) {
            // グロスパターンの検出（英字とピリオドの組み合わせ）
            const glossPattern = /[a-zA-Z]+(\.[a-zA-Z0-9]+)*/g;
            
            return glossText.replace(glossPattern, (match) => {
                // 日本語が含まれている場合は除外
                if (match.match(/[ぁ-んァ-ヶー一-龯]/)) {
                    return match;
                }
                return `<span class="gloss-clickable" data-gloss="${match}">${match}</span>`;
            });
        }
        
        // 音声を再生
        async function playExample(id) {
            const audio = document.getElementById('audio');
            const exampleItem = document.querySelector(`[data-id="${id}"]`);
            
            if (!audio || !exampleItem) {
                console.error('Audio element or example item not found');
                return;
            }
            
            // 既に再生中の場合は停止
            if (currentlyPlaying === id && !audio.paused) {
                audio.pause();
                updatePlayingState(null);
                return;
            }
            
            try {
                // 対応する音声URLを取得
                const audioUrl = audioUrls[id - 1];
                if (!audioUrl) {
                    throw new Error(`音声ファイルが見つかりません (例文 ${id})`);
                }
                
                console.log(`Playing audio ${id}: ${audioUrl}`);
                
                // 音声を停止してリセット
                audio.pause();
                audio.currentTime = 0;
                
                // 直接URLを使用（CORSプロキシは最後の手段として）
                let finalUrl = audioUrl;
                
                // 新しい音声をロード
                audio.src = finalUrl;
                
                // ロード完了を待ってから再生
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Audio playback started successfully');
                            updatePlayingState(id);
                        })
                        .catch(async (error) => {
                            console.error('Initial playback failed:', error);
                            
                            // CORSエラーの場合はプロキシを試す
                            if (error.name === 'NotAllowedError' || error.name === 'NotSupportedError') {
                                console.log('Trying with CORS proxy...');
                                
                                // CORSプロキシを使用
                                finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(audioUrl);
                                audio.src = finalUrl;
                                
                                try {
                                    await audio.play();
                                    updatePlayingState(id);
                                    console.log('Playback successful with CORS proxy');
                                } catch (proxyError) {
                                    console.error('CORS proxy also failed:', proxyError);
                                    
                                    // 別のCORSプロキシを試す
                                    finalUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(audioUrl);
                                    audio.src = finalUrl;
                                    
                                    try {
                                        await audio.play();
                                        updatePlayingState(id);
                                        console.log('Playback successful with alternative proxy');
                                    } catch (altProxyError) {
                                        console.error('All playback attempts failed:', altProxyError);
                                        showStatus(`音声の再生に失敗しました (例文 ${id})。ブラウザの設定やネットワークを確認してください。`, 'error');
                                    }
                                }
                            }
                        });
                }
                
            } catch (error) {
                console.error('音声再生エラー:', error);
                showStatus('音声の再生に失敗しました: ' + error.message, 'error');
            }
        }
        
        // 全体音声を再生
        async function playFullAudio() {
            const audio = document.getElementById('audio');
            const playAllBtn = document.getElementById('playAllBtn');
            
            if (!fullAudioUrl) {
                showStatus('全体音声のURLが設定されていません', 'error');
                return;
            }
            
            // 既に再生中の場合は停止
            if (currentlyPlaying === 'full' && !audio.paused) {
                audio.pause();
                updatePlayingState(null);
                return;
            }
            
            try {
                // 音声を停止してリセット
                audio.pause();
                audio.currentTime = 0;
                
                // 直接URLを使用
                let finalUrl = fullAudioUrl;
                
                console.log('Playing full audio:', finalUrl);
                
                audio.src = finalUrl;
                
                // 再生を試みる
                const playPromise = audio.play();
                
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            console.log('Full audio playback started successfully');
                            playAllBtn.classList.add('playing');
                            playAllBtn.querySelector('.button-text').textContent = '停止';
                            playAllBtn.querySelector('.button-icon').textContent = '⏸';
                            updatePlayingState('full');
                        })
                        .catch(async (error) => {
                            console.error('Full audio playback failed:', error);
                            
                            // CORSエラーの場合はプロキシを試す
                            if (error.name === 'NotAllowedError' || error.name === 'NotSupportedError') {
                                console.log('Trying with CORS proxy for full audio...');
                                
                                finalUrl = 'https://corsproxy.io/?' + encodeURIComponent(fullAudioUrl);
                                audio.src = finalUrl;
                                
                                try {
                                    await audio.play();
                                    playAllBtn.classList.add('playing');
                                    playAllBtn.querySelector('.button-text').textContent = '停止';
                                    playAllBtn.querySelector('.button-icon').textContent = '⏸';
                                    updatePlayingState('full');
                                } catch (proxyError) {
                                    console.error('CORS proxy also failed:', proxyError);
                                    showStatus('全体音声の再生に失敗しました', 'error');
                                }
                            }
                        });
                }
                
            } catch (error) {
                console.error('全体音声の再生エラー:', error);
                showStatus('全体音声の再生に失敗しました: ' + error.message, 'error');
            }
        }
        
        // 再生状態を更新
        function updatePlayingState(id) {
            const audioPlayer = document.getElementById('audioPlayer');
            const currentExample = document.getElementById('currentExample');
            const playAllBtn = document.getElementById('playAllBtn');
            
            // すべての例文のハイライトを解除
            document.querySelectorAll('.example-item').forEach(item => {
                item.classList.remove('playing');
                item.querySelector('.play-icon').textContent = '▶';
            });
            
            // 全体音声ボタンのリセット
            playAllBtn.classList.remove('playing');
            playAllBtn.querySelector('.button-text').textContent = '全体音声を再生';
            playAllBtn.querySelector('.button-icon').textContent = '▶';
            
            if (id === 'full') {
                // 全体音声再生中
                currentExample.textContent = '全体音声';
                audioPlayer.classList.add('active');
                playAllBtn.classList.add('playing');
                playAllBtn.querySelector('.button-text').textContent = '停止';
                playAllBtn.querySelector('.button-icon').textContent = '⏸';
            } else if (id !== null) {
                // 個別例文再生中
                const playingItem = document.querySelector(`[data-id="${id}"]`);
                if (playingItem) {
                    playingItem.classList.add('playing');
                    playingItem.querySelector('.play-icon').textContent = '⏸';
                }
                currentExample.textContent = `例文 (${id})`;
                audioPlayer.classList.add('active');
            } else {
                // 停止
                audioPlayer.classList.remove('active');
                document.getElementById('progressBar').style.width = '0%';
            }
            
            currentlyPlaying = id;
        }
        
        // 進行状況を更新
        function updateProgress() {
            const audio = document.getElementById('audio');
            const progressBar = document.getElementById('progressBar');
            
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progress + '%';
            }
        }
        
        // グロスの吹き出しを表示
        async function showGlossTooltip(gloss, element) {
            const tooltip = document.getElementById('glossTooltip');
            const glossTitle = document.getElementById('glossTitle');
            const glossDescription = document.getElementById('glossDescription');
            
            // グロスの翻訳を取得
            const translation = await getGlossTranslation(gloss);
            
            glossTitle.textContent = gloss.toUpperCase();
            glossDescription.textContent = translation;
            
            // 位置を計算
            const rect = element.getBoundingClientRect();
            const tooltipWidth = 300;
            let left = rect.left + (rect.width / 2) - (tooltipWidth / 2);
            const top = rect.top - 80;
            
            // 画面からはみ出ないように調整
            if (left < 10) left = 10;
            if (left + tooltipWidth > window.innerWidth - 10) {
                left = window.innerWidth - tooltipWidth - 10;
            }
            
            tooltip.style.left = left + 'px';
            tooltip.style.top = top + 'px';
            tooltip.classList.add('show');
        }

        // 複合グロスを解析して説明を生成
        async function getGlossTranslation(gloss) {
            // 内蔵辞書から検索
            const parts = gloss.toLowerCase().split('.');
            const translations = [];
            let allFound = true;
            
            for (const part of parts) {
                if (glossDictionary[part]) {
                    translations.push(glossDictionary[part]);
                } else if (part.match(/^\d+$/)) {
                    translations.push(part + '人称');
                } else {
                    // 辞書に見つからない場合
                    allFound = false;
                    translations.push(part.toUpperCase());
                }
            }
            
            if (!allFound) {
                // 一つでも見つからないグロスがあった場合
                return 'SearchGlossになし';
            }
            
            if (translations.length > 1) {
                return translations.join('・');
            } else if (translations.length === 1) {
                return translations[0];
            } else {
                return 'SearchGlossになし';
            }
        }
